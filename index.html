<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conectores Cloze</title>
<meta name="description" content="Practica los conectores del Oxford Cloze: tarjetas, familias, huecos, trampas y textos estilo examen.">
<meta name="theme-color" content="#2546CF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cloze">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts.css">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<style>
/* Layout: una sola columna (máx. 760px). Inicio = tablero + 5 tarjetas de modo; cada modo es una vista con barra superior y una tarjeta de pregunta. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --ink:#131929; --muted:#596379; --line:#D7DDE8;
  --accent:#2546CF; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --good:#1B8455; --bad:#C23E37; --near:#A86A10; --xp:#C9821B;
  --chip-s:68%; --chip-l:91%; --chip-tl:28%; --fam-l:40%;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --surface:#161B2B; --surface-2:#1F2638; --ink:#E7EBF4; --muted:#98A2B8; --line:#2A3247;
    --accent:#86A0FF; --accent-ink:#0E1220; --accent-soft:#232C4A;
    --good:#4BC489; --bad:#F2766E; --near:#E6AE4E; --xp:#F0B552;
    --chip-s:45%; --chip-l:22%; --chip-tl:80%; --fam-l:68%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2B; --surface-2:#1F2638; --ink:#E7EBF4; --muted:#98A2B8; --line:#2A3247;
  --accent:#86A0FF; --accent-ink:#0E1220; --accent-soft:#232C4A;
  --good:#4BC489; --bad:#F2766E; --near:#E6AE4E; --xp:#F0B552;
  --chip-s:45%; --chip-l:22%; --chip-tl:80%; --fam-l:68%;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{flex:none}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

/* Barra superior */
.top{display:flex;align-items:center;gap:10px;padding-block:2px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.brand .gap{display:inline-block;width:1.6em;border-bottom:3px solid var(--accent);transform:translateY(-3px)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.xp{color:var(--xp)}
.pill.sync{font-weight:400;color:var(--muted);background:transparent;border:1px solid var(--line)}
.viewtitle{font-family:var(--f-display);font-weight:800;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Paneles */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .4s}
.bar.xpb>i{background:var(--xp)}
.bar.thin{height:6px}

/* Tablero de inicio */
.dash{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.dash .lvl h2{font-size:30px;font-weight:800}
.dash .lvl .rank{font-family:var(--f-display);font-weight:600;color:var(--accent);font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.stat small{color:var(--muted);font-size:13px}
.goal{display:flex;flex-direction:column;gap:8px}
.goal .row b{font-variant-numeric:tabular-nums}
@media (max-width:560px){.dash{grid-template-columns:1fr}}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:border-color .15s,transform .15s;min-width:0}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.mode .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mode h3{font-size:18px;font-weight:800}
.mode p{font-size:14px;color:var(--muted)}
.mode .meta{font-size:13px;font-weight:700;margin-top:auto;font-variant-numeric:tabular-nums}
.mode.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px}
.mode.wide .txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.mode.wide.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode.wide.primary p{color:inherit;opacity:.85}
.mode.wide.primary .ic{background:color-mix(in srgb,var(--accent-ink) 18%,transparent);color:inherit}

/* Chips de familia */
.chip{--h:220;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 60% var(--chip-tl));white-space:nowrap}
.chip.src{background:var(--surface-2);color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:700}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Segmentado */
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* Pregunta */
.q{display:flex;flex-direction:column;gap:16px}
.q .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sentence{font-size:clamp(20px,4.8vw,26px);line-height:1.6;text-wrap:pretty}
.blank{display:inline-block;min-width:4.2em;padding:0 .2em;border-bottom:3px solid var(--accent);font-family:var(--f-mono);font-weight:700;color:var(--accent);text-align:center;line-height:1.25}
.blank.good{color:var(--good);border-color:var(--good)}
.blank.bad{color:var(--bad);border-color:var(--bad)}
.blank.near{color:var(--near);border-color:var(--near)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:700;font-size:15px;text-align:left;min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;flex:none}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt[disabled]{cursor:default}
.opt.fam{font-family:var(--f-body);font-size:16px}
.typing{display:flex;gap:10px}
.typing input{flex:1;min-width:0;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:17px}
.typing input:focus{border-color:var(--accent);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:default}
.hint{font-size:15px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}

.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--line);background:var(--surface)}
.fb.good{border-color:var(--good)} .fb.bad{border-color:var(--bad)} .fb.near{border-color:var(--near)}
.fb .verdict{font-family:var(--f-display);font-weight:800;font-size:19px}
.fb.good .verdict{color:var(--good)} .fb.bad .verdict{color:var(--bad)} .fb.near .verdict{color:var(--near)}
.fb .w{font-family:var(--f-mono);font-weight:700}
.rule{font-size:15px;border-left:3px solid var(--accent);padding-left:10px}

/* Tarjetas (flashcards) */
.flipwrap{perspective:1400px}
.flip{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;min-height:280px;display:flex;flex-direction:column;gap:12px}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1.05;margin-block:auto;text-align:center;overflow-wrap:anywhere}
.face .tap{text-align:center;font-size:13px;color:var(--muted)}
.face .ex{font-size:17px}
.face .ex mark{background:var(--accent-soft);color:var(--ink);padding:0 3px;border-radius:4px;font-weight:700}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grade button{padding:12px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.grade button small{font-weight:400;color:var(--muted);font-size:12px}
.grade .g1{border-color:var(--bad)} .grade .g2{border-color:var(--near)} .grade .g3{border-color:var(--good)}

/* Examen */
.passage{font-size:clamp(18px,4.3vw,22px);line-height:1.85;text-wrap:pretty}
.slot{display:inline-flex;align-items:baseline;gap:4px;min-width:5.2em;padding:0 6px;margin:0 2px;border-bottom:3px solid var(--line);font-family:var(--f-mono);font-weight:700;font-size:.88em;color:var(--accent);border-radius:6px 6px 0 0;vertical-align:baseline}
.slot sup{font-size:11px;color:var(--muted);font-weight:700}
.slot.sel{border-color:var(--accent);background:var(--accent-soft)}
.slot.filled{border-color:var(--accent)}
.slot.good{border-color:var(--good);color:var(--good)} .slot.bad{border-color:var(--bad);color:var(--bad)}
.slot input{width:8.5em;max-width:46vw;border:0;background:transparent;font:inherit;color:var(--ink);padding:0;outline:none}
.slot.good input{color:var(--good)} .slot.bad input{color:var(--bad)}
.exlist{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.exlist li{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2)}
.exlist .n{font-family:var(--f-mono);font-weight:700;width:1.6em;flex:none}
.exlist .ok{color:var(--good)} .exlist .no{color:var(--bad)}

/* Listas */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.item:hover{border-color:var(--accent)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .txt b{font-family:var(--f-display);font-size:17px}
.item .txt span{font-size:14px;color:var(--muted)}
.score{font-family:var(--f-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* Progreso */
.famrow{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:12px;align-items:center}
.famrow .name{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.famrow .bar>i{background:hsl(var(--h) 65% 50%)}
.famrow button{font-size:13px;font-weight:700;color:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;border:1px dashed var(--line);color:var(--muted)}
.badge b{font-family:var(--f-display);font-size:15px}
.badge small{font-size:12px}
.badge.on{border-style:solid;border-color:var(--xp);color:var(--ink);background:color-mix(in srgb,var(--xp) 10%,var(--surface))}
.badge.on b{color:var(--xp)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.field input{padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:400}
.hard{display:flex;flex-wrap:wrap;gap:8px}
.hard span{font-family:var(--f-mono);font-size:14px;padding:4px 10px;border-radius:8px;background:var(--surface-2)}
.hard span em{font-style:normal;color:var(--bad);font-weight:700}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;transition:.25s;z-index:20;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .x{color:var(--xp)}

.center{text-align:center;align-items:center}
.done h2{font-size:28px}
.big-num{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}

/* ---- Cada familia: su fuente y su color ---- */
.chip{font-family:var(--ff,var(--f-body));font-weight:var(--fwt,700)}
.chip.src{font-family:var(--f-body);font-weight:700}
.fw{font-family:var(--ff);font-weight:var(--fwt,700);color:hsl(var(--h) 72% var(--fam-l))}
.fchip[data-f]{font-family:var(--ff);font-weight:var(--fwt,700)}
.fchip[data-f][aria-pressed="true"]{background:hsl(var(--h) 72% var(--fam-l));border-color:hsl(var(--h) 72% var(--fam-l));color:var(--surface)}
.famrow .name{font-family:var(--ff);font-weight:var(--fwt,700);color:hsl(var(--h) 72% var(--fam-l))}
.opt.fam{font-family:var(--ff);font-weight:var(--fwt,700);color:hsl(var(--h) 72% var(--fam-l));font-size:17px}
.blank.good,.blank.bad,.blank.near{font-family:var(--ff,var(--f-mono));font-weight:var(--fwt,700)}

/* ---- Escenas animadas de cada modo ---- */
.mode{position:relative;overflow:hidden}
.scene{height:74px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;font-size:14px}
.mode.wide .scene{width:132px;flex:none;height:78px}
.mode.wide.primary .scene{background:color-mix(in srgb,var(--accent-ink) 14%,transparent);color:var(--accent-ink)}
.mini-flip{width:96px;height:50px;position:relative;transform-style:preserve-3d;animation:miniflip 3.4s ease-in-out infinite}
.mf{position:absolute;inset:0;display:grid;place-items:center;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--line);font-size:20px}
.mf.b{transform:rotateY(180deg);background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--f-body);font-weight:700;font-size:15px}
@keyframes miniflip{0%,28%{transform:rotateY(0)}42%,78%{transform:rotateY(180deg)}92%,100%{transform:rotateY(360deg)}}
.sc-fam{flex-wrap:wrap;align-content:center;padding:0 8px;gap:6px}
.tok{display:inline-block;padding:3px 10px;border-radius:999px;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 60% var(--chip-tl));font-family:var(--ff);font-weight:var(--fwt,700);font-size:14px;animation:tokdrop 3.6s cubic-bezier(.3,1.5,.5,1) infinite both}
.tok:nth-child(2){animation-delay:.35s}.tok:nth-child(3){animation-delay:.7s}
@keyframes tokdrop{0%{transform:translateY(-44px) rotate(-10deg);opacity:0}14%{transform:none;opacity:1}78%{transform:none;opacity:1}92%,100%{transform:translateY(12px);opacity:0}}
.sc-gap .ln{font-size:13px;white-space:nowrap}
.slotm{display:inline-block;width:2.5em;border-bottom:2.5px solid var(--accent);text-align:center;animation:slotok 3s infinite}
.drop{display:inline-block;font-family:var(--ff);font-weight:var(--fwt);color:hsl(var(--h) 72% var(--fam-l));animation:dropin 3s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes dropin{0%,8%{transform:translateY(-36px) rotate(-14deg);opacity:0}30%{transform:none;opacity:1}86%{opacity:1;transform:none}100%{opacity:0}}
@keyframes slotok{0%,28%{border-color:var(--accent)}34%,86%{border-color:var(--good)}100%{border-color:var(--accent)}}
.sc-trap{flex-direction:column;gap:5px}
.sc-trap .pair{display:flex;gap:6px}
@media (max-width:460px){.sc-trap .pair{flex-direction:column;align-items:center;gap:4px}.sc-trap .tn{display:none}.mode.wide .scene{width:96px}}
.tw{font-family:var(--f-mono);font-weight:700;font-size:12px;padding:2px 7px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.tw.w1{animation:trapno 4s infinite}
.tw.w2{animation:trapyes 4s infinite}
.tn{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
@keyframes trapno{0%,18%{transform:none}22%{transform:translateX(-6px);border-color:var(--bad);color:var(--bad)}26%{transform:translateX(6px)}30%{transform:translateX(-3px)}34%,62%{transform:none;border-color:var(--bad);color:var(--bad);opacity:.5}72%,100%{opacity:1}}
@keyframes trapyes{0%,40%{transform:none}48%{transform:scale(1.18);border-color:var(--good);color:var(--good)}56%,86%{transform:scale(1);border-color:var(--good);color:var(--good)}}
.sc-exam{flex-direction:column;align-items:stretch;padding:12px 14px;gap:9px}
.er{display:flex;gap:5px;align-items:center}
.er i{height:5px;border-radius:3px;background:currentColor;opacity:.35}
.er b{width:26px;height:11px;border-radius:3px;border:1.5px dashed currentColor;animation:efill 4s infinite}
.er:nth-child(2) b{animation-delay:.5s}.er:nth-child(3) b{animation-delay:1s}
@keyframes efill{0%,15%{background:transparent;transform:scale(1)}22%{transform:scale(1.35)}28%,85%{background:currentColor;border-style:solid;transform:scale(1)}100%{background:transparent}}
.sc-prog{align-items:flex-end;padding-bottom:12px;gap:8px}

const FAM_KEYS = Object.keys(FAM);

/* [familia, palabra, significado, nota de gramática, ejemplo del PDF, frase de vida diaria, frase de ficción, fuente] */
const RAW = [
["add","and","y","Une dos palabras o ideas del mismo tipo.","She studies English {and} French.","I bought bread {and} milk.","Shepard {and} Garrus checked the Normandy's main gun.","Mass Effect"],
["add","also","también","Va antes del verbo principal: He also enjoys…","He {also} enjoys reading.","My sister {also} works on weekends.","Rocky {also} wanted to learn human words.","Project Hail Mary"],
["add","moreover","además / es más","Patrón: ; moreover, + idea más fuerte.","It is cheap; {moreover}, it is reliable.","The apartment is big; {moreover}, it is close to my job.","The Lancer is powerful; {moreover}, it has a chainsaw.","Gears of War"],
["add","furthermore","además","Al inicio de la oración + coma. Suena formal.","{Furthermore}, the results were positive.","The café has good coffee. {Furthermore}, the Wi-Fi is fast.","The Covenant had more ships. {Furthermore}, they had better shields.","Halo"],
["add","in addition","además","In addition, + oración. (In addition to + nombre.)","{In addition}, we have more time.","I work full time. {In addition}, I take English classes.","Ender was a great strategist. {In addition}, he understood his enemies.","Ender's Game"],
["add","besides","además / aparte de","Besides + nombre o -ing = aparte de.","{Besides} English, she studies French.","{Besides} pizza, they ordered tacos.","{Besides} his sword, the Warden carried a heavy shield.","Dragon Age"],
["add","not only ... but also","no solo... sino también","Dos partes: not only A but also B.","It is {not only} useful {but also} easy.","The test was {not only} long {but also} difficult.","Joker is {not only} a student {but also} a Phantom Thief.","Persona 5"],
["seq","first / firstly","primero","Abre una lista de pasos.","{First}, read the question.","{First}, turn on the coffee machine.","{First}, Grace had to remember his own name.","Project Hail Mary"],
["seq","next","después / a continuación","El paso que sigue.","{Next}, choose an answer.","{Next}, add the eggs to the pan.","{Next}, the Master Chief reloaded his rifle.","Halo"],
["seq","then","luego / entonces","Une un paso con el siguiente.","{Then}, check the context.","I took a shower and {then} I had breakfast.","Artyom put on his gas mask and {then} went up to the surface.","Metro"],
["seq","after that","después de eso","Después de eso, + siguiente acción.","{After that}, review your work.","We had dinner. {After that}, we watched a movie.","Deckard found the photo. {After that}, he went to the club.","Blade Runner"],
["seq","subsequently","posteriormente","Formal: lo que pasó más tarde.","She applied and {subsequently} got a job.","He moved to Monterrey and {subsequently} opened a store.","Ender won the game and {subsequently} became a commander.","Ender's Game"],
["seq","finally","finalmente","El último paso de una lista.","{Finally}, submit your answers.","{Finally}, close the door and turn off the lights.","{Finally}, Shepard gave the order to jump through the relay.","Mass Effect"],
["con","but","pero","Une dos ideas en la misma oración: …, but …","It was cold, {but} we went out.","I wanted to sleep, {but} my alarm rang.","Marcus was tired, {but} he kept fighting.","Gears of War"],
["con","however","sin embargo","Patrón: ; however, — o al inicio: However, …","It was late; {however}, we stayed.","The movie was long; {however}, it was fun.","The station looked empty; {however}, Artyom heard noises.","Metro"],
["con","whereas","mientras que","Compara dos datos opuestos: A, whereas B.","I like tea, {whereas} she prefers coffee.","My brother is tall, {whereas} I am short.","Garrus prefers rifles, {whereas} Wrex prefers shotguns.","Mass Effect"],
["con","while","mientras que (contraste)","Aquí no es tiempo: compara dos cosas opuestas.","{While} he reads, she prefers podcasts.","{While} my mom loves the beach, my dad prefers the mountains.","{While} Morgana loves sushi, Ryuji prefers ramen.","Persona 5"],
["con","unlike","a diferencia de","Unlike + nombre (persona o cosa).","{Unlike} John, Ana likes math.","{Unlike} my old phone, this one has a great camera.","{Unlike} humans, Rocky cannot see light.","Project Hail Mary"],
["con","on the other hand","por otro lado","Presenta el otro lado de una idea.","It is cheap; {on the other hand}, it is slow.","The city is exciting. {On the other hand}, it is very expensive.","Replicants are strong. {On the other hand}, they live only four years.","Blade Runner"],
["con","in contrast","en cambio / en contraste","Al inicio + coma: muestra la diferencia.","{In contrast}, the new method is faster.","Summer here is hot. {In contrast}, winter is very cold.","The surface is cold and deadly. {In contrast}, the stations are warm.","Metro"],
["cnc","although","aunque","Although + oración completa (sujeto + verbo).","{Although} it rained, we went out.","{Although} I was hungry, I waited for my friends.","{Although} the Flood was everywhere, Chief kept moving.","Halo"],
["cnc","even though","aunque / a pesar de que","Como although pero más fuerte. + oración.","{Even though} he was tired, he studied.","{Even though} it was Sunday, she went to the office.","{Even though} he was only a child, Ender led the fleet.","Ender's Game"],
["cnc","despite","a pesar de","Despite + nombre o -ing. ¡Nunca «despite of»!","{Despite} the rain, we went out.","{Despite} the traffic, we arrived on time.","{Despite} the darkspawn, the Warden crossed the forest.","Dragon Age"],
["cnc","in spite of","a pesar de","In spite of + nombre o -ing.","{In spite of} feeling ill, she worked.","{In spite of} the noise, the baby slept.","{In spite of} his injuries, Dom stayed with the squad.","Gears of War"],
["cnc","nevertheless","no obstante","Patrón: ; nevertheless, — tras una idea negativa.","The test was hard; {nevertheless}, she passed.","The bus was full; {nevertheless}, we got on.","The mission seemed impossible; {nevertheless}, Grace kept working.","Project Hail Mary"],
["cnc","even so","aun así","Even so, + oración. Suena natural y hablado.","It was difficult. {Even so}, we finished.","The shoes were expensive. {Even so}, I bought them.","The Palace was huge. {Even so}, the Phantom Thieves explored it in one day.","Persona 5"],
["cau","because","porque","Because + oración (sujeto + verbo).","We stayed in {because} it was raining.","I took a taxi {because} I was late.","Cortana warned Chief {because} the ship was in danger.","Halo"],

["cau","since","ya que / puesto que","Since + oración; muchas veces al inicio.","{Since} it was late, we left.","{Since} you are here, help me with the boxes.","{Since} the air was toxic, Artyom checked his filters.","Metro"],
["cau","due to","debido a","Due to + nombre; muy común después de «be».","The delay was {due to} traffic.","The flight was cancelled {due to} bad weather.","The Normandy's delay was {due to} a Reaper attack.","Mass Effect"],
["cau","because of this","por este motivo","Idea. + Because of this, + lo que pasó.","It was unsafe. {Because of this}, we left.","My phone died. {Because of this}, I missed your call.","The Blight was spreading. {Because of this}, the Grey Wardens gathered.","Dragon Age"],
["res","so","así que / por eso","…, so + resultado (en la misma oración).","It was late, {so} we left.","I was thirsty, {so} I drank some water.","Ryuji was hungry, {so} he went to the ramen shop.","Persona 5"],
["res","therefore","por lo tanto","Patrón: ; therefore, — resultado lógico.","She practiced; {therefore}, she improved.","He saved money every month; {therefore}, he bought a car.","Ender studied every battle; {therefore}, he rarely lost.","Ender's Game"],
["res","thus","por consiguiente","Formal. Igual que therefore.","Costs rose; {thus}, prices increased.","The road was wet; {thus}, the drivers went slowly.","Her memories were implanted; {thus}, she believed she was human.","Blade Runner"],
["res","consequently","en consecuencia","Patrón: ; consequently, + resultado.","He missed the bus; {consequently}, he was late.","I forgot my keys; {consequently}, I waited outside.","Grace lost his memory; {consequently}, he did not know why he was in space.","Project Hail Mary"],
["res","as a result","como resultado","Al inicio + coma.","It rained; {as a result}, we stayed home.","She studied every night. {As a result}, she got an A.","The Arbiter changed sides. {As a result}, the war changed.","Halo"],
["res","hence","de ahí que / por tanto","Muy formal; puede ir solo con un nombre: hence the delay.","The road was closed; {hence} the delay.","He lost his glasses; {hence} the headache.","The city never sees the sun; {hence} the neon lights everywhere.","Blade Runner"],
["res","for this reason","por esta razón","Idea. + For this reason, + decisión.","{For this reason}, we canceled the trip.","It is my mom's birthday. {For this reason}, I am cooking dinner.","The Reapers were coming. {For this reason}, Shepard needed allies.","Mass Effect"],
["res","accordingly","en consecuencia","Actuar de acuerdo con lo que pasó.","The plan changed; {accordingly}, we adapted.","The weather changed; {accordingly}, we packed jackets.","The enemy moved; {accordingly}, Ender changed his formation.","Ender's Game"],
["ill","for example","por ejemplo","Puede ir entre comas o al inicio.","Many fruits, {for example} apples, have fiber.","I like Mexican food, {for example} tamales.","Some companions are very funny, {for example} Varric.","Dragon Age"],
["ill","for instance","por ejemplo","Igual que for example.","Try a sport, {for instance} tennis.","Drink something warm, {for instance} tea.","Some weapons are very heavy, {for instance} the Spartan Laser.","Halo"],
["ill","such as","como / tales como","Va pegado al sustantivo + lista.","I like sports {such as} tennis.","We need fruits {such as} mangoes and bananas.","The squad found weapons {such as} the Longshot and the Gnasher.","Gears of War"],
["ill","including","incluyendo","Grupo, including + parte del grupo.","Five students, {including} Ana, passed.","Everyone came to the party, {including} my grandma.","The whole crew, {including} Tali, joined the mission.","Mass Effect"],
["ill","namely","a saber / específicamente","Nombra exactamente lo que acabas de mencionar.","We need two things, {namely} time and money.","I have one problem, {namely} my noisy neighbor.","Grace had one goal, {namely} saving Earth.","Project Hail Mary"],
["ill","in other words","en otras palabras","Repite la idea de forma más simple.","It is optional; {in other words}, you can skip it.","The store is closed; {in other words}, we have to come back tomorrow.","The Battle Room has no gravity; {in other words}, the students float.","Ender's Game"],
["ill","to illustrate","para ilustrar","Anuncia un ejemplo que explica algo.","{To illustrate}, consider this example.","{To illustrate}, imagine a city with no cars.","{To illustrate}, the instructor showed a video of a Spartan in action.","Halo"],
["cmp","similarly","de manera similar","Patrón: ; similarly, — dos cosas parecidas.","Ana studies daily; {similarly}, Luis reviews.","Cats need attention; {similarly}, dogs need daily walks.","Shepard protects the crew; {similarly}, Garrus protects Shepard.","Mass Effect"],
["cmp","likewise","igualmente","Igual que similarly.","He enjoys art; {likewise}, she loves painting.","My dad loves soccer; {likewise}, my uncle never misses a game.","Marcus trusts Dom; {likewise}, Dom trusts Marcus.","Gears of War"],
["cmp","equally","igualmente / por igual","Equally + adjetivo.","Both answers are {equally} acceptable.","Both cafés are {equally} good.","Both paths in the Deep Roads were {equally} dangerous.","Dragon Age"],
["cmp","in the same way","de la misma manera","Al inicio + coma.","{In the same way}, practice helps memory.","Plants need water. {In the same way}, people need rest.","Joker builds bonds with his friends. {In the same way}, his Personas get stronger.","Persona 5"],
["cmp","just as","al igual que","Just as + oración, + oración parecida.","{Just as} adults learn, children adapt.","{Just as} I love pizza, my kids love it too.","{Just as} Deckard hunts replicants, someone hunts him.","Blade Runner"],
["cmp","as ... as","tan... como","as + adjetivo + as.","This task is {as} easy {as} the first one.","My son is {as} tall {as} me now.","Rocky is {as} smart {as} Grace.","Project Hail Mary"],
["cmp","similar to","similar a","similar to + nombre.","Her answer is {similar to} mine.","This song is {similar to} the one on the radio.","The Arbiter's armor is {similar to} the Elites' armor.","Halo"],
["tim","meanwhile","mientras tanto","Dos cosas pasan al mismo tiempo.","I cooked; {meanwhile}, she cleaned.","I washed the dishes; {meanwhile}, my brother took out the trash.","Artyom fought on the surface; {meanwhile}, the station waited for news.","Metro"],
["tim","eventually","finalmente / con el tiempo","Después de mucho tiempo o esfuerzo.","{Eventually}, we found a solution.","I practiced a lot, and {eventually} I learned to swim.","Grace and Rocky {eventually} learned to talk to each other.","Project Hail Mary"],
["tim","at last","por fin","Expresa alivio tras una larga espera.","{At last}, the bus arrived.","{At last}, it's Friday!","{At last}, the Normandy reached the Citadel.","Mass Effect"],

["because vs because of","<b>Because / since</b> + oración (sujeto + verbo). <b>Because of / due to</b> + nombre. Piensa: «of» siempre necesita una cosa después.",[

["finally vs eventually vs at last","<b>Finally</b> = el último paso de una lista. <b>Eventually</b> = después de mucho tiempo o esfuerzo. <b>At last</b> = ¡por fin! (alivio tras esperar).",[

["although vs however","Los dos expresan contraste, pero <b>although</b> une dos ideas en UNA oración (Although A, B). <b>However</b> empieza una oración NUEVA después de punto o punto y coma, y lleva coma. Truco: si después del hueco hay una coma pegada, es however.",[

const norm = s => String(s).toLowerCase().replace(/[’`]/g,"'").replace(/\.\.\.|…/g," ").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim();
function formsOf(w){
  if (w.includes("...")) return [norm(w)];
  const out=[];
  w.split(" / ").forEach(p=>{ if(p.includes("(to)")){const b=p.replace("(to)","").trim(); out.push(norm(b), norm(b+" to"));} else out.push(norm(p)); });
  return out;
}

function mergeDefaults(o){ const d=defaults(); const s=Object.assign(d,o||{}); s.prefs=Object.assign(defaults().prefs,(o&&o.prefs)||{}); return s; }
let dbRef=null, sync="local", saveTimer=null, writing=false, again=false;
function save(){ S.updatedAt=Date.now(); try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} if(dbRef){ clearTimeout(saveTimer); saveTimer=setTimeout(pushDb,2000); } }
async function pushDb(){
  if(!dbRef) return; if(writing){again=true;return;} writing=true;
  try{ await dbRef.set({state:JSON.stringify(S),updatedAt:S.updatedAt}); setSync("ok"); }catch(e){ setSync("err"); }
  writing=false; if(again){again=false; pushDb();}
}
function setSync(s){ sync=s; const el=document.getElementById("sync"); if(el) el.outerHTML=syncPill(); }
async function pullDb(){
  if(!dbRef) return;
  try{
    const snap = await Promise.race([dbRef.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    if(snap.exists){
      const d=snap.data(); const remote=JSON.parse(d.state||"{}");
      if((remote.updatedAt||0) > (S.updatedAt||0)){ S=mergeDefaults(remote); shownXP=S.xp; try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} render(); }
      else if((S.updatedAt||0) > (remote.updatedAt||0)) pushDb();
    } else if(S.updatedAt>0) pushDb();
    setSync("ok");
  }catch(e){ setSync("err"); }
}
async function initDb(){
  for(let i=0;i<20 && !(window.claude && window.claude.use);i++) await new Promise(r=>setTimeout(r,250));
  if(!(window.claude && window.claude.use)) return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc("data/users/"+id+"/cloze");
    await pullDb();
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && !writing) pullDb(); });
  }catch(e){ setSync("local"); }
}

const keyOf = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey = () => keyOf(new Date());
const dayNum = k => { const [y,m,d]=k.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const today = () => dayNum(todayKey());
const keyFromNum = n => { const d=new Date(n*864e5); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); };
function daysLeft(){ try{ return dayNum(S.examDate)-today(); }catch(e){ return 0; } }
function todayCount(){ return S.days[todayKey()]||0; }
function streak(){
  let n=0, t=today(); if((S.days[keyFromNum(t)]||0) < S.goal) t--;
  while((S.days[keyFromNum(t)]||0) >= S.goal){ n++; t--; }
  return n;
}
function levelInfo(){
  let lvl=1; while(75*lvl*(lvl+1) <= S.xp) lvl++;
  const base=75*(lvl-1)*lvl, next=75*lvl*(lvl+1);
  return {lvl, name:LEVELS[Math.min(lvl-1,LEVELS.length-1)], pct:(S.xp-base)/(next-base), toNext:next-S.xp};
}
const ws = id => S.words[id] || (S.words[id]={b:0,due:0,ok:0,bad:0});
const isSeen = id => !!S.words[id] && (S.words[id].ok+S.words[id].bad>0 || S.words[id].b>0);
function famMastery(f){ const list=WORDS.filter(w=>w.fam===f); return list.reduce((a,w)=>a+(S.words[w.id]?S.words[w.id].b:0),0)/(list.length*5); }
const mastered = () => WORDS.filter(w=>inPlay(w) && S.words[w.id] && S.words[w.id].b>=4).length;
function dueList(){ const t=today(); return WORDS.filter(w=>S.words[w.id] && S.words[w.id].b>0 && S.words[w.id].due<=t); }
function newLeft(){ if(S.newDay!==todayKey()) return NEW_PER_DAY; return Math.max(0,NEW_PER_DAY-S.newCount); }
const inPlay = w => !w.c1 || S.prefs.c1!=="0";
const totalWords = () => WORDS.filter(inPlay).length;
const unseen = () => WORDS.filter(w=>inPlay(w) && !(S.words[w.id] && S.words[w.id].b>0));
function addMiss(t,wid,src){ if(wid==null) return; S.miss[t]={wid,n:2,src:src||""}; const ks=Object.keys(S.miss); if(ks.length>80) delete S.miss[ks[0]]; }
function hitMiss(t){ const m=S.miss[t]; if(!m) return; m.n--; if(m.n<=0) delete S.miss[t]; }
function sentenceOfBlank(text,n){
  const sents=text.match(/[^.!?]+[.!?]+\s*/g)||[text]; let c=0;
  for(const sn of sents){ const k=(sn.match(/\{/g)||[]).length; if(n<c+k){ let j=c-1; return sn.trim().replace(/\{([^}]+)\}/g,(m,x)=>{ j++; return j===n?m:x; }); } c+=k; }
  return null;
}

let combo=0;
let DEV="d"; try{ DEV=localStorage.getItem(LS+"-dev")||""; if(!DEV){ DEV="d"+Math.random().toString(36).slice(2,9); localStorage.setItem(LS+"-dev",DEV); } }catch(e){ DEV="d"+Math.random().toString(36).slice(2,9); }
function addXP(n){ S.xp+=n; S.xpBy[DEV]=(S.xpBy[DEV]||0)+n; }
function award(correct, base, wid, opts={}){
  const k=todayKey(), before=S.days[k]||0; S.days[k]=before+1;
  const lvlB=levelInfo().lvl;
  let gained=0;
  if(correct){ combo++; gained=base+Math.min(combo-1,5)*2; addXP(gained); if(combo>S.bestCombo) S.bestCombo=combo; }
  else combo=0;
  if(wid!=null && !opts.noWord){ const s=ws(wid); if(correct) s.ok++; else { s.bad++; if(s.b>1){s.b--;} s.due=Math.min(s.due||0,today()); } }
  const had=new Set(Object.keys(S.badges));
  checkBadges();
  save();
  if(correct){ fx({t:"xp",amt:gained}); if(combo>1) fx({t:"combo",n:combo}); }
  if(before<S.goal && S.days[k]>=S.goal) fx({t:"goal"});
  const L=levelInfo(); if(L.lvl>lvlB) fx({t:"level",L});
  BADGES.forEach(b=>{ if(S.badges[b[0]] && !had.has(b[0])) fx({t:"badge",name:b[1]}); });
  updateTopPills();
  return gained;
}
let lastBadges=new Set();
function checkBadges(){
  const B=S.badges, set=k=>{ if(!B[k]) B[k]=todayKey(); };
  if(Object.values(S.days).some(v=>v>0)) set("first");
  if(S.bestCombo>=10) set("combo10");
  const st=streak(); if(st>=3) set("streak3"); if(st>=7) set("streak7");
  if(FAM_KEYS.every(f=>WORDS.some(w=>w.fam===f && isSeen(w.id)))) set("allfam");
  if(Object.values(S.exams).some(v=>v>=100)) set("exam100");
  if(TRAPS.every((t,i)=>S.traps[i]!=null)) set("traps");
  const m=mastered(); if(m>=25) set("m25"); if(m>=totalWords()) set("mall");
}

/* ---------- Tarjetas ---------- */
function buildCardQueue(extra){
  const t=today();
  let q=shuffle(dueList()).map(w=>w.id);
  if(extra){ q=shuffle(WORDS.filter(w=>isSeen(w.id))).slice(0,10).map(w=>w.id); if(!q.length) q=shuffle(WORDS).slice(0,10).map(w=>w.id); }
  else { const nn=unseen().slice(0,newLeft()).map(w=>w.id); q=q.concat(nn); }
  return q;
}

function checkMeaning(input, es){
  const n=norm(input.normalize("NFD").replace(/[̀-ͯ]/g,""));
  if(!n) return false;
  const opts = es.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\(.*?\)/g,"").split(/[\/]/).map(x=>norm(x)).filter(Boolean);
  return opts.some(o=>o===n || (n.length>=4 && (o.includes(n)||n.includes(o))));
}
function gradeCard(g){
  const C=V.cards, id=C.q.shift(), s=ws(id), t=today();
  const wasNew=!(s.b>0);
  if(g===1){ s.b=1; s.due=t; s.bad++; C.q.splice(Math.min(3,C.q.length),0,id); }
  else if(g===2){ s.b=Math.max(1,s.b); s.due=t+1; s.ok++; }
  else { s.b=Math.min(5,s.b+1); s.due=t+INTERVALS[s.b]; s.ok++; }
  if(wasNew){ if(S.newDay!==todayKey()){S.newDay=todayKey();S.newCount=0;} S.newCount++; }
  C.done++; C.flipped=false; C.revealed=false; C.typed=null; C.deal=true;
  award(g>1, g===3?8:5, id, {noWord:true});
  viewCards();
}

/* ---------- Familia ---------- */
function newFamQ(){
  const fams=S.prefs.famFams.length?S.prefs.famFams:FAM_KEYS;
  let pool=WORDS.filter(w=>fams.includes(w.fam)&&inPlay(w)); if(!pool.length) pool=WORDS.filter(inPlay);
  const w=pool[Math.floor(Math.random()*pool.length)];
  if(Math.random()<0.65){
    const others=shuffle(FAM_KEYS.filter(f=>f!==w.fam)).slice(0,3);
    return {type:"w2f",wid:w.id,opts:shuffle([w.fam,...others]),ans:w.fam,picked:null};
  }
  const others=shuffle(WORDS.filter(x=>x.fam!==w.fam&&inPlay(x))).slice(0,3).map(x=>x.id);
  return {type:"f2w",fam:w.fam,wid:w.id,opts:shuffle([w.id,...others]),ans:w.id,picked:null};
}
function famFilter(key){
  const sel=S.prefs[key];
  return `<details class="panel" style="padding:12px 14px"><summary style="cursor:pointer;font-weight:700">Familias: ${sel.length?sel.map(f=>FAM[f].n).join(", "):"todas"}</summary>
   <div class="chips" style="margin-top:12px"><button class="fchip" data-act="famAll" data-k="${key}" aria-pressed="${!sel.length}">Todas</button>${FAM_KEYS.map(f=>`<button class="fchip" style="${famStyle(f)}" data-act="famTog" data-k="${key}" data-f="${f}" aria-pressed="${sel.includes(f)}">${FAM[f].n}</button>`).join("")}</div></details>`;
}

/* ---------- Llena el hueco ---------- */
let recentS=[];
function newGapQ(){
  if(route()==="errores"){
    const keys=Object.keys(S.miss).filter(t=>WORDS[S.miss[t].wid]); if(!keys.length) return null;
    let c=keys.filter(t=>t!==recentS[recentS.length-1]); if(!c.length) c=keys;
    const t=pick(c), m=S.miss[t]; recentS.push(t); if(recentS.length>12) recentS.shift();
    return {sen:{t,src:m.src||"Mis errores",k:"miss"}, wid:m.wid, opts:shuffle([m.wid,...distractors(m.wid,3,true)]), picked:null, typed:null, res:null, hint:false};
  }
  const fams=S.prefs.hFams.length?S.prefs.hFams:FAM_KEYS;
  let pool=WORDS.filter(w=>fams.includes(w.fam)&&inPlay(w)); if(!pool.length) pool=WORDS.filter(inPlay);
  const weights=pool.map(w=>{ const s=S.words[w.id]; return 1+(s?s.bad*2+(5-s.b):5); });
  let tot=weights.reduce((a,b)=>a+b,0), r=Math.random()*tot, w=pool[0];
  for(let i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0){ w=pool[i]; break; } }
  let cands=SENTENCES.filter(s=>s.wid===w.id);
  const wantFic=Math.random()<0.5;
  let c=cands.filter(s=>(s.k==="fic")===wantFic && !recentS.includes(s.t)); if(!c.length) c=cands;
  const sen=pick(c); recentS.push(sen.t); if(recentS.length>12) recentS.shift();
  return {sen, wid:w.id, opts:shuffle([w.id,...distractors(w.id,3,S.prefs.diff!=="normal")]), picked:null, typed:null, res:null, hint:false};
}
/* Fácil: opciones de otras familias. Tipo examen: palabras de significado cercano que piden OTRA gramática
   (although / despite / however), y si faltan, palabras con la misma gramática pero otro significado. */
function distractors(wid,n,hard){
  const w=WORDS[wid], ok=x=>x.id!==wid && inPlay(x) && !x.w.includes("..."), out=[];
  if(!hard){
    const usedF=new Set([w.fam]);
    for(const x of shuffle(WORDS)){ if(out.length>=n) break; if(!ok(x)||usedF.has(x.fam)) continue; usedF.add(x.fam); out.push(x.id); }
    return out;
  }
  const near=shuffle(WORDS.filter(x=>ok(x)&&x.tg===w.tg&&x.slot!==w.slot)), seen=new Set();
  for(const x of near){ if(out.length>=n) break; if(seen.has(x.slot)) continue; seen.add(x.slot); out.push(x.id); }
  for(const x of near){ if(out.length>=n) break; if(!out.includes(x.id)) out.push(x.id); }
  for(const x of shuffle(WORDS.filter(x=>ok(x)&&x.tg!==w.tg&&x.slot===w.slot))){ if(out.length>=n) break; out.push(x.id); }
  for(const x of shuffle(WORDS)){ if(out.length>=n) break; if(ok(x)&&x.tg!==w.tg&&!out.includes(x.id)) out.push(x.id); }
  return out;
}
const diffSeg = () => `<div class="seg" role="group" aria-label="Dificultad de las opciones"><button data-act="pref" data-k="diff" data-v="normal" aria-pressed="${S.prefs.diff==="normal"}">Fácil</button><button data-act="pref" data-k="diff" data-v="examen" aria-pressed="${S.prefs.diff!=="normal"}">Tipo examen</button></div>`;
function sentenceHtml(t, res, label, fam){
  return parts(t).map(p=>{
    if(p.t) return esc(p.t);
    if(!res) return `<span class="blank">${label||"&nbsp;"}</span>`;
    return `<span class="blank ${res}" style="${fam?famStyle(fam):""}">${esc(p.b)}</span>`;
  }).join("");
}
function typedVerdict(input, wid){
  const n=norm(input); const w=WORDS[wid];
  if(w.forms.includes(n)) return "good";
  const other=FORM_INDEX[n];
  if(other!=null && WORDS[other].fam===w.fam) return "near";
  return "bad";
}

  } else if(!answered){

      ${Q.hint?`<div class="hint">Empieza con <b class="mono">${esc(w.w[0])}</b> · tiene ${w.w.split(" / ")[0].replace(/\.\.\./g," ").trim().split(/\s+/).length} palabra(s) · significa «${esc(w.es)}»</div>`:`<button class="btn line small" data-act="gapHint" style="align-self:flex-start">Ver pista</button>`}`;

    <div class="panel q">
      <div class="head">${srcChip(Q.sen.src)}${answered?famChip(w.fam):""}</div>
      <div class="sentence">${sentenceHtml(Q.sen.t, answered?Q.res:null, null, w.fam)}</div>
      ${body}

function answerGap(picked, typed){
  const Q=V.gap; if(Q.res) return;

function answerTrap(v){
  const T=V.trap; if(T.res) return; const it=T.items[T.k];
  T.picked=v; T.res = norm(v)===norm(answerOf(it[0]))?"good":"bad"; if(T.res==="good") T.ok++;
  const wid=FORM_INDEX[norm(answerOf(it[0]))];
  award(T.res==="good", S.prefs.tMode==="type"?15:10, wid!=null?wid:null);
  if(T.res!=="good"){ addMiss(it[0],wid,"Trampa: "+TRAPS[T.i][0]); save(); }
  viewTraps();
}

/* ---------- Examen ---------- */
function startExam(i){
  const p=PASSAGES[i], hard=S.prefs.diff!=="normal";
  const blanks=parts(p[2]).filter(x=>x.b).map((x,n)=>{ const wid=FORM_INDEX[norm(x.b)];
    const ds = p[3] ? p[3][n].map(o=>FORM_INDEX[norm(o)]) : distractors(wid,3,hard);
    return {b:x.b, wid, opts:shuffle([wid,...ds]), val:null, typed:""}; });
  V.exam={i, blanks, sel:0, checked:false};
}

function checkExam(){
  const E=V.exam, P=S.prefs;
  E.blanks.forEach(B=>{
    if(P.eMode==="opts") B.ok = B.val===B.wid;
    else { const v=typedVerdict(B.typed,B.wid); B.ok = v==="good"; B.near = v==="near"; }
  });
  E.checked=true;
  const ok=E.blanks.filter(B=>B.ok).length, pct=Math.round(ok/E.blanks.length*100);
  S.exams[E.i]=Math.max(S.exams[E.i]||0,pct);
  if(V.sim){ V.sim.ok+=ok; V.sim.tot+=E.blanks.length; V.sim.pausedAt=Date.now(); }
  E.blanks.forEach((B,n)=>{ if(!B.ok){ const t=sentenceOfBlank(PASSAGES[E.i][2],n); if(t) addMiss(t,B.wid,PASSAGES[E.i][1]); } });
  const k=todayKey(); S.days[k]=(S.days[k]||0)+E.blanks.length;
  E.blanks.forEach(B=>{ const s=ws(B.wid); if(B.ok) s.ok++; else { s.bad++; if(s.b>1) s.b--; s.due=Math.min(s.due||0,today()); } });
  const lvlB=levelInfo().lvl, goalB=(S.days[k]||0)-E.blanks.length<S.goal && (S.days[k]||0)>=S.goal;
  const gained=ok*(P.eMode==="type"?20:15)+(pct===100?30:0); addXP(gained);
  const before=new Set(Object.keys(S.badges)); checkBadges(); save();
  if(gained) fx({t:"xp",amt:gained});
  if(goalB) fx({t:"goal"});
  const L=levelInfo(); if(L.lvl>lvlB) fx({t:"level",L});
  BADGES.forEach(b=>{ if(S.badges[b[0]]&&!before.has(b[0])) fx({t:"badge",name:b[1]}); });
  if(pct===100) setTimeout(()=>{ burst(innerWidth*.3,innerHeight*.35,80); burst(innerWidth*.7,innerHeight*.35,80); },500);
  viewExam(); window.scrollTo({top:0,behavior:RM?"auto":"smooth"});
}

    if(d.k==="fMode"||d.k==="fDir"){ if(V.cards){V.cards.flipped=false;V.cards.revealed=false;V.cards.typed=null;} }
    if(d.k==="hMode") V.gap=null;
    if(d.k==="diff"){ V.gap=null; if(V.exam&&!V.exam.checked&&!V.sim) startExam(V.exam.i); }
    if(d.k==="c1"){ V.gap=null; V.fam=null; V.cards=null; }
    if(d.k==="tMode" && V.trap && V.trap.step==="q" && V.trap.res==null){}
    if(d.k==="eMode" && V.exam && !V.exam.checked){ V.exam.blanks.forEach(B=>{B.val=null;B.typed="";}); V.exam.sel=0; }
    render(); },
  famAll(d){ S.prefs[d.k]=[]; save(); if(d.k==="hFams") V.gap=null; else V.fam=null; render(); },
  famTog(d){ const a=S.prefs[d.k]; const i=a.indexOf(d.f); if(i>=0) a.splice(i,1); else a.push(d.f); save(); if(d.k==="hFams") V.gap=null; else V.fam=null; render(); },
  flip(){ const C=V.cards; if(!C) return;
    if(!C.revealed){ C.flipped=true; C.revealed=true; C.anim=true; viewCards(); return; }
    C.flipped=!C.flipped; const f=app.querySelector(".flip"); if(f) f.classList.toggle("on",C.flipped); },
  grade(d){ const g=+d.g, w=app.querySelector(".flipwrap"); if(RM||!w){ gradeCard(g); return; } busy=true; w.classList.add(g===1?"out-l":g===3?"out-r":"out-u"); setTimeout(()=>{ busy=false; gradeCard(g); },280); },
  cardsExtra(){ V.cards={q:buildCardQueue(true),flipped:false,done:V.cards?V.cards.done:0,typed:null}; viewCards(); },
  famPick(d){ const Q=V.fam; if(Q.picked!=null) return; Q.picked = Q.type==="w2f"? d.v : +d.v; const ok=String(Q.picked)===String(Q.ans); award(ok,10,Q.wid); viewFamily(); },
  famNext(){ V.fam=newFamQ(); viewFamily(); },
  gapPick(d,b){ busy=true; flyWord(b, app.querySelector(".sentence .blank"), WORDS[+d.v].w).then(()=>{ busy=false; answerGap(+d.v,null); }); },
  gapHint(){ V.gap.hint=true; viewGap(); },
  gapNext(){ V.gap=newGapQ(); viewGap(); },
  trapOpen(d){ V.trap={i:+d.i,step:"intro"}; viewTraps(); window.scrollTo(0,0); },
  trapList(){ V.trap=null; viewTraps(); },
  trapStart(){ const T=V.trap; T.step="q"; T.items=shuffle(TRAPS[T.i][2]).map(it=>[it[0],shuffle(it[1]),it[2]]); T.k=0; T.ok=0; T.res=null; T.picked=null; viewTraps(); },
  trapPick(d,b){ busy=true; flyWord(b, app.querySelector(".sentence .blank"), d.v).then(()=>{ busy=false; answerTrap(d.v); }); },
  trapNext(){ const T=V.trap; if(T.k+1<T.items.length){ T.k++; T.res=null; T.picked=null; } else { T.step="end"; const pct=Math.round(T.ok/T.items.length*100); S.traps[T.i]=Math.max(S.traps[T.i]||0,pct); const had=new Set(Object.keys(S.badges)); checkBadges(); save(); BADGES.forEach(b=>{ if(S.badges[b[0]]&&!had.has(b[0])) toast("Logro desbloqueado: "+b[1],"badge"); }); if(pct===100) setTimeout(()=>burst(innerWidth/2,innerHeight*.3,110),350); } viewTraps(); },
  examOpen(d){ startExam(+d.i); viewExam(); window.scrollTo(0,0); },
  examRandom(){ let i=Math.floor(Math.random()*PASSAGES.length); if(V.exam&&PASSAGES.length>1&&i===V.exam.i) i=(i+1)%PASSAGES.length; startExam(i); viewExam(); window.scrollTo(0,0); },
  examList(){ stopSim(); V.exam=null; viewExam(); },
  simStart(){ const pool=PASSAGES.map((p,i)=>i).filter(i=>PASSAGES[i][3]); const list=shuffle(pool).slice(0,3);
    stopSim(); V.sim={list,idx:0,ok:0,tot:0,t0:Date.now(),limit:12*60,done:false}; startExam(list[0]);
    simT=setInterval(()=>{ if(!V.sim||V.sim.done){ clearInterval(simT); return; } const el=document.getElementById("simTimer"); if(el){ const sec=simLeft(); el.textContent=fmtT(sec); el.classList.toggle("late",sec<0); } },1000);
    viewExam(); window.scrollTo(0,0); },
  simNext(){ const M=V.sim; if(!M) return; if(M.pausedAt){ M.t0+=Date.now()-M.pausedAt; M.pausedAt=0; }
    if(M.idx+1<M.list.length){ M.idx++; startExam(M.list[M.idx]); }
    else { M.done=true; M.sec=Math.round((Date.now()-M.t0)/1000); clearInterval(simT); const pct=Math.round(M.ok/M.tot*100); S.sims.push({d:todayKey(),pct,sec:M.sec}); if(S.sims.length>20) S.sims.shift(); save(); V.exam=null; if(pct>=85) setTimeout(()=>burst(innerWidth/2,innerHeight*.3,130),350); }
    viewExam(); window.scrollTo(0,0); },
  examRetry(){ startExam(V.exam.i); viewExam(); },
  examSel(d){ if(V.exam.checked) return; V.exam.sel=+d.n; viewExam(); },
  examPick(d,b){ if(!d.fly){ busy=true; return flyWord(b, app.querySelector(".slot.sel"), WORDS[+d.v].w).then(()=>{ busy=false; ACT.examPick({v:d.v,fly:1}); }); } const E=V.exam; E.blanks[E.sel].val=+d.v; const nx=E.blanks.findIndex((B,i)=>i>E.sel&&B.val==null); const any=E.blanks.findIndex(B=>B.val==null); E.sel = nx>=0?nx:(any>=0?any:E.sel); viewExam(); },
  examCheck(){ checkExam(); },
  practiceFam(d){ S.prefs.hFams=[d.f]; save(); V.gap=null; location.hash="hueco"; },
  reset(){ V.reset=true; viewProgress(); },
  resetNo(){ V.reset=false; viewProgress(); },
  xferOpen(d){ V.xfer = V.xfer===d.m ? null : d.m; V.xferMsg=""; viewProgress(); const t=document.getElementById(d.m==="export"?"xferOut":"xferIn"); if(t){ t.focus(); if(d.m==="export") t.select(); } },
  async copyCode(){ const t=document.getElementById("xferOut"); try{ await navigator.clipboard.writeText(t.value); toast("Código copiado"); }catch(e){ t.focus(); t.select(); toast("Selecciónalo y cópialo"); } },
  downloadCode(){ const blob=new Blob([exportCode()],{type:"text/plain"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="progreso-cloze-"+todayKey()+".txt"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); },
  doImport(){ const t=document.getElementById("xferIn"); runImport(t?t.value:""); },
  async install(){ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; viewProgress(); },
  resetYes(){ const p=S.prefs; S=defaults(); S.prefs=p; combo=0; shownXP=0; V={}; save(); toast("Progreso reiniciado"); viewProgress(); }
};
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||!b.dataset.act) return;
  if(b.disabled||busy) return;
  const fn=ACT[b.dataset.act]; if(fn) fn(b.dataset,b);
});
app.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  const kind=f.dataset.form;
  if(kind==="gapType"){ answerGap(null, document.getElementById("gapInput").value); }
  if(kind==="trapType"){ answerTrap(document.getElementById("trapInput").value); }
  if(kind==="cardType"){
    const C=V.cards, w=WORDS[C.q[0]], v=document.getElementById("cardInput").value;
    const ok = S.prefs.fDir==="en" ? checkMeaning(v,w.es) : w.forms.includes(norm(v));
    C.typed={v,ok}; C.flipped=true; C.revealed=true; C.anim=true; viewCards();
  }
});
app.addEventListener("input",e=>{
  const n=e.target.dataset&&e.target.dataset.blank; if(n==null||!V.exam) return;
  V.exam.blanks[+n].typed=e.target.value;
  const btn=app.querySelector('[data-act="examCheck"]'); if(btn) btn.disabled=!V.exam.blanks.every(B=>B.typed.trim());
});
app.addEventListener("change",e=>{
  if(e.target.id==="xferFile" && e.target.files[0]){ const r=new FileReader(); r.onload=()=>runImport(String(r.result)); r.readAsText(e.target.files[0]); return; }
  if(e.target.id==="examDate"&&e.target.value){ S.examDate=e.target.value; save(); viewProgress(); }
  if(e.target.id==="goalInput"){ const g=Math.max(5,Math.min(200,parseInt(e.target.value,10)||20)); S.goal=g; save(); viewProgress(); }
});
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||e.metaKey||e.ctrlKey||e.altKey||busy||document.querySelector(".overlay")) return;
  const r=route();
  if(/^[1-4]$/.test(e.key)){
    const btns=[...app.querySelectorAll(".opt:not([disabled])")]; const b=btns[+e.key-1]; if(b){ e.preventDefault(); b.click(); }
    if(r==="tarjetas"&&V.cards&&V.cards.revealed){ const g=app.querySelector(`[data-act="grade"][data-g="${e.key}"]`); if(g){ e.preventDefault(); g.click(); } }
    return;
  }
  if(e.key==="Enter"||e.key===" "){
    if(r==="tarjetas"&&V.cards&&(V.cards.revealed||S.prefs.fMode==="flip")){ e.preventDefault(); ACT.flip(); return; }
    if(e.key!=="Enter") return;
    const next=app.querySelector('[data-act="gapNext"],[data-act="famNext"],[data-act="trapNext"]'); if(next){ e.preventDefault(); next.click(); }
  }
});
window.addEventListener("hashchange",()=>{ V.gap=null; if(route()!=="examen"&&V.sim){ stopSim(); V.exam=null; } render(); window.scrollTo(0,0); });

/* ===================== EFECTOS ===================== */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy=false, shownXP=0, rolling=false, lastPt={x:innerWidth/2,y:innerHeight/2};
document.addEventListener("pointerdown",e=>{ lastPt={x:e.clientX,y:e.clientY}; },true);
let FXQ=[];
function fx(e){ FXQ.push(e); if(FXQ.length===1) queueMicrotask(flushFx); }
function flushFx(){
  const list=FXQ; FXQ=[];
  list.forEach(e=>{
    if(e.t==="xp"){ floatXP(e.amt); startXPRoll(); }
    if(e.t==="combo"){ const c=document.getElementById("comboPill"); if(c && !RM){ c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
      if(e.n%5===0){ if(c){ const r=c.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,45,.8); } toast(`¡Combo x${e.n}! Más XP por respuesta`,"badge"); } }
    if(e.t==="goal"){ burst(innerWidth/2,innerHeight*.3,100); toast("¡Meta del día cumplida!","badge"); }
    if(e.t==="badge") toast("Logro desbloqueado: "+e.name,"badge");
    if(e.t==="level") setTimeout(()=>showLevelUp(e.L),450);
  });
}
function paintXP(){ const x=document.getElementById("xpPill"); if(x) x.textContent=shownXP+" XP"; }
function startXPRoll(){
  if(RM){ shownXP=S.xp; paintXP(); return; }
  if(shownXP>S.xp) shownXP=S.xp;
  if(rolling) return; rolling=true;
  const step=()=>{ const d=S.xp-shownXP; if(d<=0){ shownXP=S.xp; rolling=false; paintXP(); return; } shownXP+=Math.max(1,Math.ceil(d*.12)); paintXP(); requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function floatXP(amt){
  if(RM) return;
  const s=document.createElement("span"); s.className="xpfloat"; s.textContent="+"+amt+" XP";
  s.style.left=Math.min(innerWidth-50,Math.max(50,lastPt.x))+"px"; s.style.top=(lastPt.y-12)+"px";
  document.body.appendChild(s); setTimeout(()=>s.remove(),1000);
}
function countUps(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const to=+el.dataset.count, suf=el.dataset.suf||"";
    if(RM||!to){ el.textContent=to+suf; return; }
    const t0=performance.now(), dur=Math.min(1100,450+to*4);
    const f=now=>{ const p=Math.min(1,(now-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suf; if(p<1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}
function flyWord(fromEl,toEl,text){
  return new Promise(res=>{
    if(RM||!fromEl||!toEl||!fromEl.animate){ res(); return; }
    const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
    const f=document.createElement("span"); f.className="flyer"; f.textContent=text; document.body.appendChild(f);
    const fw=f.offsetWidth, fh=f.offsetHeight;
    const x0=a.left+a.width/2-fw/2, y0=a.top+a.height/2-fh/2, x1=b.left+b.width/2-fw/2, y1=b.top+b.height/2-fh/2;
    const lift=Math.min(y0,y1)-50;
    const anim=f.animate([
      {transform:`translate(${x0}px,${y0}px) scale(1) rotate(0deg)`},
      {transform:`translate(${(x0+x1)/2}px,${lift}px) scale(1.18) rotate(-6deg)`,offset:.5},
      {transform:`translate(${x1}px,${y1}px) scale(1) rotate(0deg)`}
    ],{duration:430,easing:"cubic-bezier(.45,0,.25,1)",fill:"forwards"});
    anim.onfinish=()=>{ f.remove(); res(); }; anim.oncancel=()=>{ f.remove(); res(); };
  });
}
let CONF=[], cv=null, craf=0;
function burst(x,y,n=60,power=1){
  if(RM) return;
  if(!cv){ cv=document.createElement("canvas"); cv.id="confetti"; document.body.appendChild(cv); }
  const dpr=window.devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const hues=FAM_KEYS.map(f=>FAM[f].h);
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(3+Math.random()*8)*power;
    CONF.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6*power,r:Math.random()*6.3,vr:(Math.random()-.5)*.45,w:5+Math.random()*7,h:3+Math.random()*4,c:`hsl(${pick(hues)} 85% 58%)`,life:1}); }
  if(!craf) craf=requestAnimationFrame(confTick);
}
function confTick(){
  const ctx=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  CONF=CONF.filter(p=>p.life>0 && p.y<innerHeight+40);
  CONF.forEach(p=>{ p.vy+=.3; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=.009;
    ctx.save(); ctx.globalAlpha=Math.min(1,p.life*2); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
  if(CONF.length) craf=requestAnimationFrame(confTick); else { craf=0; ctx.clearRect(0,0,innerWidth,innerHeight); }
}
function showLevelUp(L){
  const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="lvlup" role="dialog" aria-modal="true" aria-label="Subiste de nivel"><div class="label">¡Subiste de nivel!</div><div class="n">${L.lvl}</div><h2>${L.name}</h2><p class="muted">Cada nivel pide un poco más de XP. Sigue así.</p><button class="btn" type="button">Continuar</button></div>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  o.querySelector("button").addEventListener("click",close);
  o.addEventListener("click",e=>{ if(e.target===o) close(); });
  o.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  o.querySelector("button").focus();
  const r=o.querySelector(".n").getBoundingClientRect(); setTimeout(()=>burst(r.left+r.width/2,r.top+r.height/2,140,1.3),150);
}

/* ===================== EXPORTAR / IMPORTAR ===================== */
function exportCode(){
  const o={v:1,xp:S.xp,xpBy:S.xpBy,bestCombo:S.bestCombo,words:S.words,days:S.days,traps:S.traps,exams:S.exams,badges:S.badges,miss:S.miss,sims:S.sims,exportedAt:new Date().toISOString()};
  return "CLOZE1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function runImport(text){
  let o=null; text=String(text||"").trim();
  try{ o = text.startsWith("CLOZE1:") ? JSON.parse(decodeURIComponent(escape(atob(text.slice(7).replace(/\s+/g,""))))) : JSON.parse(text); }catch(e){ o=null; }
  if(!o||typeof o!=="object"||!o.words){ V.xferMsg="Ese código no se pudo leer. Revisa que lo hayas copiado completo."; V.xferOk=false; viewProgress(); return; }
  const lvlB=levelInfo().lvl; let n=0;
  for(const id in o.words){ if(!WORDS[id]) continue; const a=S.words[id], b=o.words[id]; n++;
    if(!a){ S.words[id]={b:b.b||0,due:b.due||0,ok:b.ok||0,bad:b.bad||0}; continue; }
    const useB=(b.b>a.b)||(b.b===a.b&&(b.ok+b.bad)>(a.ok+a.bad)); const base=Object.assign({},useB?b:a);
    base.ok=Math.max(a.ok||0,b.ok||0); base.bad=Math.max(a.bad||0,b.bad||0); S.words[id]=base; }
  for(const k in (o.days||{})) S.days[k]=Math.max(S.days[k]||0,o.days[k]||0);
  for(const k in (o.traps||{})) S.traps[k]=Math.max(S.traps[k]==null?0:S.traps[k],o.traps[k]||0);
  for(const k in (o.exams||{})) S.exams[k]=Math.max(S.exams[k]==null?0:S.exams[k],o.exams[k]||0);
  for(const k in (o.badges||{})) if(!S.badges[k]) S.badges[k]=o.badges[k];
  for(const k in (o.miss||{})) if(!S.miss[k]) S.miss[k]=o.miss[k];
  (o.sims||[]).forEach(x=>{ if(!S.sims.some(y=>y.d===x.d&&y.pct===x.pct&&y.sec===x.sec)) S.sims.push(x); });
  S.bestCombo=Math.max(S.bestCombo||0,o.bestCombo||0);
  const by=o.xpBy&&Object.keys(o.xpBy).length?o.xpBy:{["imp"+(o.exportedAt||"")]:o.xp||0};
  for(const d in by) if(d!==DEV) S.xpBy[d]=Math.max(S.xpBy[d]||0,by[d]||0);
  S.xp=Object.values(S.xpBy).reduce((a,b)=>a+b,0);
  checkBadges(); save(); shownXP=S.xp;
  V.xfer=null; V.xferMsg=`Listo: se combinaron ${n} palabras. Ahora tienes ${S.xp} XP.`; V.xferOk=true;
  viewProgress(); if(levelInfo().lvl>lvlB) setTimeout(()=>showLevelUp(levelInfo()),300); else burst(innerWidth/2,innerHeight*.3,60);
}
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(route()==="progreso") viewProgress(); });
if("serviceWorker" in navigator && location.protocol!=="file:") window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));

/* ===================== ARRANQUE ===================== */
try{ const th=localStorage.getItem(LS+"-theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
loadLocal();
if(!S.xpBy||!Object.keys(S.xpBy).length){ S.xpBy={}; if(S.xp) S.xpBy[DEV]=S.xp; }
shownXP=S.xp;
render();
</script>
